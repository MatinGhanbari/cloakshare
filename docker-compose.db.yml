# Cloak — local PostgreSQL ONLY
#
# Brings up just the database for local development. The API (run via
# `pnpm --filter @cloak/api dev` or the full docker-compose.yml) connects to it
# through DATABASE_URL.
#
# Setup:
#   1. Put your password in a .env file next to this compose file (or export it):
#        POSTGRES_PASSWORD=your-strong-password
#   2. Start the database:
#        docker compose -f docker-compose.db.yml up -d
#   3. In apps/api/.env (or your shell) set:
#        DATABASE_URL=postgresql://postgres:your-strong-password@localhost:5432/cloak
#
# The password is required from the environment — nothing is hard-coded here.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env or environment}
      POSTGRES_DB: cloak
    ports:
      - "5432:5432"
    volumes:
      - cloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloak"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cloak_postgres_data:
